name: baaqoon-platform
version: "3.8"

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: baaqoon_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: baaqoon_admin
      POSTGRES_PASSWORD: baaqoon_secret_dev
      POSTGRES_DB: baaqoon_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baaqoon_admin -d baaqoon_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Cache & WebSocket Adapter
  redis:
    image: redis:7-alpine
    container_name: baaqoon_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. MinIO (S3-Compatible Object Storage for Files)
  minio:
    image: quay.io/minio/minio:latest
    container_name: baaqoon_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: baaqoon_storage_admin
      MINIO_ROOT_PASSWORD: baaqoon_storage_secret
    ports:
      - "9000:9000" # API Port
      - "9001:9001" # Console Port
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # 4. MinIO Setup (Creates default buckets automatically)
  minio-setup:
    image: quay.io/minio/mc:latest
    container_name: baaqoon_minio_setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc config host add myminio http://minio:9000 baaqoon_storage_admin baaqoon_storage_secret;
      /usr/bin/mc mb myminio/baaqoon-avatars --ignore-existing;
      /usr/bin/mc mb myminio/baaqoon-verification --ignore-existing;
      /usr/bin/mc mb myminio/baaqoon-curriculum --ignore-existing;
      /usr/bin/mc mb myminio/baaqoon-assignments --ignore-existing;
      /usr/bin/mc mb myminio/baaqoon-submissions --ignore-existing;
      /usr/bin/mc mb myminio/baaqoon-chat --ignore-existing;
      /usr/bin/mc anonymous set public myminio/baaqoon-avatars;
      exit 0;
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:
